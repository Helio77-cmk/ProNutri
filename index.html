<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sequência Fit</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--card:#161b22;--card2:#1c232d;--line:#2a323d;--tx:#f0f3f6;--mu:#8b96a3;--ac:#58e06b;--acd:#2fa84a;--fire:#ff9f1c;--blue:#4cc9f0;--r:18px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700}
.app{max-width:480px;margin:0 auto;padding:16px 16px 40px;display:grid;gap:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 12px;font-weight:800}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#1d2430,#161b22)}
.flame{font-size:56px;line-height:1;filter:grayscale(1) brightness(.6);transition:.4s}
.flame.on{filter:none;animation:flick 1.6s infinite alternate}
@keyframes flick{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.08) rotate(3deg)}}
.big{font-size:42px;font-weight:900;color:var(--fire);line-height:1}
.sub{color:var(--mu);font-size:14px;margin-top:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.day{font-size:12px;color:var(--mu)}
.dot{width:34px;height:34px;border-radius:50%;margin:6px auto 0;border:2px solid var(--line);display:grid;place-items:center;font-size:16px;background:var(--card2)}
.dot.ok{background:var(--ac);border-color:var(--ac);color:#06210d}
.dot.today{border-color:var(--blue)}
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:110px;height:110px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:22px;font-weight:900}
.ring small{display:block;font-size:11px;color:var(--mu);font-weight:700}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--card2);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;color:var(--tx);padding:10px 4px;font:inherit;font-size:13px;cursor:pointer;text-align:center}
.chip span{display:block;font-size:24px}
.chip.sel{border-color:var(--blue);background:#14303a}
.chip:active{transform:translateY(2px);border-bottom-width:2px}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 6px}
input[type=range]{width:100%;accent-color:var(--ac)}
input[type=number],input[type=text]{width:100%;background:var(--card2);border:2px solid var(--line);border-radius:12px;color:var(--tx);padding:10px;font:inherit;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{background:var(--card2);border:2px solid var(--line);border-radius:12px;color:var(--mu);padding:9px;font:inherit;font-size:13px;cursor:pointer}
.seg button.sel{color:var(--tx);border-color:var(--ac)}
.val{color:var(--tx);font-weight:900}
.cta{width:100%;margin-top:18px;background:var(--ac);color:#06210d;border:0;border-bottom:5px solid var(--acd);border-radius:16px;padding:15px;font:inherit;font-size:16px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.cta:active{transform:translateY(3px);border-bottom-width:2px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card2);border-radius:14px;padding:12px}
.stat b{font-size:22px;display:block}
.stat span{font-size:12px;color:var(--mu)}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .e{font-size:26px}.item .t{flex:1;font-size:14px}.item .t small{display:block;color:var(--mu);font-weight:700}
.del{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer}
.empty{color:var(--mu);font-size:14px;text-align:center;padding:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ac);color:#06210d;padding:14px 22px;border-radius:16px;font-weight:900;transition:.4s;z-index:20;text-align:center;max-width:90%}
.toast.show{transform:translate(-50%,0)}
.pc{position:fixed;top:40%;left:50%;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:30;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.pop{animation:pop .6s}
@keyframes pop{40%{transform:scale(1.25)}}
details summary{cursor:pointer;color:var(--mu);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:5px}
.tabs button{background:none;border:0;border-radius:12px;color:var(--mu);padding:10px 2px;font:inherit;font-size:12px;font-weight:900;cursor:pointer}
.tabs button.sel{background:var(--card2);color:var(--tx)}
.hide{display:none!important}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:6px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mu)}
.bar i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--blue);min-height:3px}
.bar.last i{background:var(--ac)}
.hb{display:grid;grid-template-columns:90px 1fr 50px;align-items:center;gap:8px;font-size:13px;margin:8px 0}
.hb div{height:12px;border-radius:6px;background:var(--card2)}.hb div i{display:block;height:100%;border-radius:6px;background:var(--ac)}
.pr{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.pr:first-of-type{border-top:0}.pr b{color:var(--fire)}
.trend{font-size:13px;margin-top:10px;color:var(--mu)}.up{color:var(--ac)}.dn{color:#ff6b6b}
.live{background:var(--card2);border-radius:14px;padding:12px;margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.live b{display:block;font-size:18px}.live span{font-size:11px;color:var(--mu)}
select{width:100%;background:var(--card2);border:2px solid var(--line);border-radius:12px;color:var(--tx);padding:10px;font:inherit;font-size:15px}
.chips.four{grid-template-columns:repeat(4,1fr)}
.seg.two{grid-template-columns:repeat(2,1fr)}.seg.auto{grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.q{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--card2);border:2px solid var(--line);color:var(--blue);font-size:12px;font-weight:900;cursor:pointer;font-style:normal;flex:none;vertical-align:middle}
.sw{display:flex;gap:4px;align-items:center}.sw button{flex:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border:2px solid var(--line);border-radius:22px 22px 0 0;max-width:480px;width:100%;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:20px}.sheet p{color:var(--mu);margin:10px 0;font-size:14px;line-height:1.5}.sheet p b{color:var(--blue);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;min-width:430px}
th,td{padding:7px 5px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:800}
tfoot td{font-weight:900;color:var(--fire);border-bottom:0}
.mb{margin:10px 0}.mb .h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.mb .t{height:10px;border-radius:6px;background:var(--card2);overflow:hidden}.mb i{display:block;height:100%;background:var(--ac);transition:width .6s}
.sg{background:var(--card2);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:14px}.sg b{display:block;margin-bottom:4px}.sg small{display:block;color:var(--mu);font-weight:700}
.tip{border-left:4px solid var(--ac);background:var(--card2);padding:10px 12px;border-radius:0 12px 12px 0;margin:8px 0;font-size:14px}
.rec{padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}.rec:first-of-type{border-top:0}.rec b{display:block;color:var(--blue);font-size:13px;margin-bottom:2px}
</style>
</head>
<body>
<div class="app">
  <div class="card hero">
    <div class="flame" id="flame">🔥</div>
    <div><div class="big" id="streak">0</div><div class="sub" id="streakTxt">dias de sequência</div><div class="sub" id="rec"></div></div>
  </div>
  <div class="tabs"><button id="t1" class="sel">🏁 Treino</button><button id="t2">📈 Perf.</button><button id="t3">📘 Guia</button><button id="t4">🍽️ Dieta</button></div>

  <div id="pg1" style="display:grid;gap:14px">
    <div class="card"><h2>Esta semana</h2><div class="week" id="week"></div></div>
    <div class="card ringwrap">
      <div class="ring">
        <svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="46" fill="none" stroke="#2a323d" stroke-width="12"/><circle id="arc" cx="55" cy="55" r="46" fill="none" stroke="#58e06b" stroke-width="12" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289" style="transition:stroke-dashoffset .8s"/></svg>
        <div class="c"><div><span id="pct">0%</span><small>da meta</small></div></div>
      </div>
      <div><div style="font-size:18px;font-weight:900" id="todayMin">0 min</div><div class="sub" id="goalTxt"></div></div>
    </div>
    <div class="card">
      <h2>Registrar treino</h2>
      <div class="chips four" id="chips"></div>
      <label id="subL"></label><div class="seg auto" id="sub"></div>
      <label>Duração: <span class="val" id="durV">30 min</span></label>
      <input type="range" id="dur" min="5" max="180" step="5" value="30">
      <div id="fields"></div>
      <label>Intensidade percebida <i class="q" data-h="inten">?</i></label>
      <div class="seg" id="seg"></div>
      <div class="live" id="live"></div>
      <button class="cta" id="done">Concluir treino</button>
    </div>
    <div class="card"><h2>Histórico</h2><div id="hist"></div></div>
    <details class="card"><summary>⚙️ Ajustes (meta e peso)</summary>
      <div class="row"><div><label>Meta diária (min)</label><input type="number" id="goal" min="5" max="300"></div><div><label>Peso (kg)</label><input type="number" id="peso" min="30" max="250"></div></div>
    </details>
  </div>

  <div id="pg2" class="hide" style="display:grid;gap:14px">
    <div class="chips four" id="pchips"></div>
    <div id="perf" style="display:grid;gap:14px"></div>
  </div>

  <div id="pg3" class="hide" style="display:grid;gap:14px">
    <div class="chips four" id="gchips"></div>
    <div id="guia" style="display:grid;gap:14px"></div>
  </div>

  <div id="pg4" class="hide" style="display:grid;gap:14px">
    <div id="dTop" style="display:grid;gap:14px"></div>
    <div class="card">
      <h2>Registrar alimento</h2>
      <label>Refeição</label><select id="fref"></select>
      <label>Alimento</label><select id="fsel"></select>
      <div id="fman" class="hide">
        <label>Nome do alimento</label><input type="text" id="fnome" placeholder="Ex.: Pizza">
        <div class="row"><div><label>kcal</label><input type="number" id="fk" min="0"></div><div><label>Proteína (g)</label><input type="number" id="fp" min="0"></div></div>
        <div class="row"><div><label>Carboidrato (g)</label><input type="number" id="fc" min="0"></div><div><label>Gordura (g)</label><input type="number" id="ff" min="0"></div></div>
        <div class="sub">Informe os valores totais da porção.</div>
      </div>
      <label>Quantidade (g)</label><input type="number" id="fg" min="0" step="5" value="100">
      <div class="sub" id="fprev" style="margin-top:10px"></div>
      <button class="cta" id="fadd">Adicionar à planilha</button>
    </div>
    <div id="dBot" style="display:grid;gap:14px"></div>
  </div>
</div>
<div class="modal hide" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
// ===== Variáveis por modalidade =====
// subs: variações com MET próprio · metrica: indicador principal de desempenho
const ATIV = {
  corrida:{nome:"Corrida",emoji:"🏃",subL:"Tipo de corrida",
    subs:{rodagem:{n:"Rodagem",met:9.8},intervalado:{n:"Intervalado",met:11.5},longao:{n:"Longão",met:9.0},trilha:{n:"Trilha",met:10.0}},
    metrica:"Pace (min/km)",menor:true},
  natacao:{nome:"Natação",emoji:"🏊",subL:"Estilo",
    subs:{crawl:{n:"Crawl",met:8.0},costas:{n:"Costas",met:6.0},peito:{n:"Peito",met:8.5},borboleta:{n:"Borboleta",met:11.0}},
    metrica:"Ritmo (min/100 m)",menor:true},
  ciclismo:{nome:"Ciclismo",emoji:"🚴",subL:"Modalidade",
    subs:{estrada:{n:"Estrada",met:8.0},mtb:{n:"MTB",met:8.5},spinning:{n:"Spinning",met:7.0}},
    metrica:"Velocidade média (km/h)",menor:false},
  musculacao:{nome:"Musculação",emoji:"🏋️",subL:"Grupo muscular",
    subs:{peito:{n:"Peito",met:5.0},costas:{n:"Costas",met:5.0},pernas:{n:"Pernas",met:6.0},ombros:{n:"Ombros",met:4.5},bracos:{n:"Braços",met:4.5},core:{n:"Core",met:4.0},full:{n:"Full body",met:6.0}},
    metrica:"Volume (kg)",menor:false}
};
const INT={leve:{n:"Leve",m:0.8},moderada:{n:"Moderada",m:1},intensa:{n:"Intensa",m:1.25}};
// Registro: {id,data,tipo,sub,min,dist(km | m na natação),ex:{piscina,elev,series,reps,carga},inten,kcal}

const $=id=>document.getElementById(id);
let st={logs:[],meta:20,peso:70,food:[]};
try{const s=localStorage.getItem("seqfit");if(s)st=Object.assign(st,JSON.parse(s))}catch(e){}
st.logs=st.logs.filter(l=>ATIV[l.tipo]&&l.sub&&ATIV[l.tipo].subs[l.sub]);if(!Array.isArray(st.food))st.food=[];
const save=()=>{try{localStorage.setItem("seqfit",JSON.stringify(st))}catch(e){}};
let sel="corrida",sub="rodagem",inten="moderada",psel="geral";

const key=d=>{const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const minOn=k=>st.logs.filter(l=>l.data===k).reduce((a,l)=>a+l.min,0);
const okDays=()=>[...new Set(st.logs.map(l=>l.data))].filter(k=>minOn(k)>=st.meta);
const f1=(n,d=1)=>(+n).toLocaleString("pt-BR",{maximumFractionDigits:d,minimumFractionDigits:0});
const pace=x=>{if(!isFinite(x)||x<=0)return "–";const m=Math.floor(x),s=Math.round((x-m)*60);return (s===60?m+1:m)+":"+String(s===60?0:s).padStart(2,"0")};
const vol=l=>(l.ex.series||0)*(l.ex.reps||0)*(l.ex.carga||0);
const kmOf=l=>l.tipo==="natacao"?l.dist/1000:l.dist||0;

// métrica principal da sessão
function metric(l){
  if(l.tipo==="corrida")return l.dist>0?l.min/l.dist:null;
  if(l.tipo==="natacao")return l.dist>0?l.min/(l.dist/100):null;
  if(l.tipo==="ciclismo")return l.dist>0?l.dist/(l.min/60):null;
  return vol(l)||null;
}
const fmtMetric=(t,v)=>v==null?"–":(t==="corrida"||t==="natacao")?pace(v):t==="ciclismo"?f1(v)+" km/h":f1(v,0)+" kg";
const classe=r=>r<=5?"Força":r<=12?"Hipertrofia":"Resistência";

function streaks(){
  const set=new Set(okDays());let d=new Date();if(!set.has(key(d)))d=addD(d,-1);
  let cur=0;while(set.has(key(d))){cur++;d=addD(d,-1)}
  let best=0,run=0,prev=null;[...set].sort().forEach(k=>{const dt=new Date(k+"T00:00:00");run=(prev&&Math.round((dt-prev)/864e5)===1)?run+1:1;best=Math.max(best,run);prev=dt});
  return{cur,best};
}

// ===== Formulário por modalidade =====
const numIn=(id,l,ph,step)=>`<div><label>${l}</label><input type="number" id="${id}" min="0" step="${step||1}" placeholder="${ph||0}"></div>`;
function buildForm(){
  $("chips").innerHTML=Object.entries(ATIV).map(([k,a])=>`<button class="chip ${k===sel?"sel":""}" data-k="${k}"><span>${a.emoji}</span>${a.nome}</button>`).join("");
  const A=ATIV[sel];if(!A.subs[sub])sub=Object.keys(A.subs)[0];
  $("subL").innerHTML=A.subL+' <i class="q" data-h="'+sel+'">?</i>';
  $("sub").innerHTML=Object.entries(A.subs).map(([k,s])=>`<div class="sw"><button class="${k===sub?"sel":""}" data-s="${k}">${s.n}</button><i class="q" data-h="${sel}:${k}">?</i></div>`).join("");
  $("seg").innerHTML=Object.entries(INT).map(([k,i])=>`<button class="${k===inten?"sel":""}" data-i="${k}">${i.n}</button>`).join("");
  let h="";
  if(sel==="corrida")h=numIn("dist","Distância (km)","5.0","0.1");
  if(sel==="natacao")h=`<div class="row">${numIn("dist","Distância (m)","1000",25)}<div><label>Piscina</label><select id="piscina"><option value="25">25 m</option><option value="50">50 m</option><option value="0">Águas abertas</option></select></div></div>`;
  if(sel==="ciclismo")h=`<div class="row">${numIn("dist","Distância (km)","20","0.1")}${numIn("elev","Ganho de elevação (m)","0",10)}</div>`;
  if(sel==="musculacao")h=`<div class="row">${numIn("series","Séries","4")}${numIn("reps","Repetições/série","10")}</div>${numIn("carga","Carga média (kg)","40","0.5")}`;
  $("fields").innerHTML=h;
  $("fields").querySelectorAll("input,select").forEach(e=>e.oninput=live);
  live();
}
function read(){
  const g=id=>$(id)?+$(id).value||0:0;
  return{tipo:sel,sub,min:+$("dur").value,dist:g("dist"),inten,ex:{piscina:g("piscina"),elev:g("elev"),series:g("series"),reps:g("reps"),carga:g("carga")}};
}
const kcalOf=l=>Math.round(ATIV[l.tipo].subs[l.sub].met*INT[l.inten].m*st.peso*l.min/60);
function live(){
  $("durV").textContent=$("dur").value+" min";
  const l=read(),m=metric(l),k=kcalOf(l);let a=["–",""],b=["–",""];
  if(sel==="corrida"){a=[fmtMetric(sel,m),"pace /km"];b=[l.dist?f1(l.dist/(l.min/60))+" km/h":"–","velocidade"]}
  if(sel==="natacao"){a=[fmtMetric(sel,m),"ritmo /100 m"];const v=l.ex.piscina?Math.round(l.dist/l.ex.piscina):0;b=[v?String(v):"–","travessias da piscina"]}
  if(sel==="ciclismo"){a=[fmtMetric(sel,m),"média"];b=[l.dist?pace(l.min/l.dist):"–","pace /km"]}
  if(sel==="musculacao"){a=[f1(vol(l),0)+" kg","volume total"];b=[l.ex.reps?classe(l.ex.reps):"–","foco do treino"]}
  $("live").innerHTML=`<div><b>${a[0]}</b><span>${a[1]}</span></div><div><b>${b[0]}</b><span>${b[1]}</span></div><div><b>${k}</b><span>kcal</span></div>`;
}

// ===== Treino =====
function renderTreino(){
  const {cur,best}=streaks(),set=new Set(okDays()),tk=key(new Date()),tm=minOn(tk);
  $("streak").textContent=cur;$("streakTxt").textContent=cur===1?"dia de sequência":"dias de sequência";
  $("flame").classList.toggle("on",cur>0);$("rec").textContent="Recorde: "+best+(best===1?" dia":" dias");
  const nm=["D","S","T","Q","Q","S","S"];let h="";
  for(let i=6;i>=0;i--){const d=addD(new Date(),-i),ok=set.has(key(d));h+=`<div><div class="day">${nm[d.getDay()]}</div><div class="dot ${ok?"ok":""} ${i===0?"today":""}">${ok?"✓":""}</div></div>`}
  $("week").innerHTML=h;
  const p=Math.min(1,tm/st.meta);$("arc").style.strokeDashoffset=289*(1-p);$("pct").textContent=Math.round(p*100)+"%";
  $("todayMin").textContent=tm+" min hoje";
  $("goalTxt").textContent=tm>=st.meta?"Meta batida! Sequência garantida 🎉":"Faltam "+(st.meta-tm)+" min para manter a sequência";
  const R=[...st.logs].reverse().slice(0,8);
  $("hist").innerHTML=R.length?R.map(l=>{const A=ATIV[l.tipo],dt=l.data.split("-").reverse().slice(0,2).join("/");

  const out=[],eaten=new Set(st.food.filter(x=>x.data===tk).map(x=>x.nome)),tr=st.logs.filter(l=>l.data===tk);
  if(!S.n)out.push(["Comece pela primeira refeição","Registre o que comeu e as sugestões passam a considerar o que ainda falta para a meta."]);
  [["proteína",2,T.p-S.p,250,10,10],["carboidrato",3,T.c-S.c,300,15,15],["gordura boa",4,T.f-S.f,40,8,10]].forEach(([nm,i,gap,cap,min,th])=>{
    if(gap<min)return;
    const L=FOODS.filter(f=>f[i]>=th&&!eaten.has(f[0])).sort((a,b)=>b[i]/b[1]-a[i]/a[1]).slice(0,4);
    out.push(["Faltam "+r0(gap)+" g de "+nm,L.map(f=>{const g=Math.max(15,Math.min(cap,r0(gap/(f[i]/100)/5)*5));return `<div>${g} g de ${f[0].toLowerCase()}<small>≈ ${r0(g*f[i]/100)} g de ${nm.split(" ")[0]} · ${r0(g*f[1]/100)} kcal</small></div>`}).join("")])});
  if(tr.length){
    if(!st.food.some(x=>x.data===tk&&x.ref==="Pós-treino")){const l=tr[tr.length-1];
      out.push(["Pós-treino ("+ATIV[l.tipo].nome.toLowerCase()+")",l.tipo==="musculacao"?"20–30 g de proteína com carboidrato em até 2 h. Ex.: iogurte natural com banana e aveia, ou frango com batata-doce.":l.tipo==="natacao"?"A natação abre o apetite: banana com iogurte natural e pão integral com ovo.":"Reponha carboidrato e proteína em até 1–2 h"+(l.min>=60?" (treino longo: priorize o carboidrato)":"")+". Ex.: arroz com frango, ou pão com ovo e uma fruta."])}
  }else out.push(["Antes do treino (1–2 h)","Carboidrato de fácil digestão e pouca gordura: banana com aveia, ou pão integral com mel."]);
  if(S.kcal>T.kcal*1.1)out.push(["Acima da meta calórica","Você passou "+r0(S.kcal-T.kcal)+" kcal. Nas próximas refeições prefira vegetais (ex.: brócolis), proteínas magras e menos gordura."]);
  if(S.n&&out.length===0)out.push(["Dia dentro da meta 🎉","Seus macros estão equilibrados. Mantenha a hidratação."]);
  return out;
}
function renderDieta(){
  const now=new Date(),tk=key(now),T=targets(tk),S=sumF(tk),rows=st.food.filter(x=>x.data===tk),tm=st.logs.filter(l=>l.data===tk).reduce((a,l)=>a+l.min,0);
  $("dTop").innerHTML=`<div class="card"><h2>Meta de hoje</h2>${mbar("Calorias",S.kcal,T.kcal,"kcal")}${mbar("Proteína",S.p,T.p,"g")}${mbar("Carboidrato",S.c,T.c,"g")}${mbar("Gordura",S.f,T.f,"g")}<div class="sub">Base de ${r0(st.peso*30)} kcal + ${T.tr} kcal de treino · Água ≈ ${f1(st.peso*.035+tm/60*.5,1)} L</div></div>`;
  let o=`<div class="card"><h2>Planilha de hoje</h2><div class="tw"><table><thead><tr><th>Refeição / alimento</th><th>g</th><th>kcal</th><th>P</th><th>C</th><th>G</th><th></th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td>${x.ref}<br><small style="color:var(--mu)">${esc(x.nome)}</small></td><td>${x.g}</td><td>${x.kcal}</td><td>${f1(x.p)}</td><td>${f1(x.c)}</td><td>${f1(x.f)}</td><td><button class="del" data-fid="${x.id}">✕</button></td></tr>`).join(""):'<tr><td colspan="7" style="text-align:center;color:var(--mu)">Nenhum alimento hoje</td></tr>'}</tbody><tfoot><tr><td>Total</td><td></td><td>${r0(S.kcal)}</td><td>${f1(S.p)}</td><td>${f1(S.c)}</td><td>${f1(S.f)}</td><td></td></tr></tfoot></table></div></div>`;
  o+=`<div class="card"><h2>Sugestões para você</h2>${sugest(T,S,tk).map(x=>`<div class="sg"><b>${x[0]}</b>${x[1]}</div>`).join("")}</div>`;
  let w="";for(let i=0;i<7;i++){const k=key(addD(now,-i)),s=sumF(k),t=targets(k),d=k.split("-").reverse().slice(0,2).join("/");
    w+=s.n?`<tr><td>${d}</td><td>${r0(s.kcal)}</td><td>${r0(s.p)}</td><td>${r0(s.c)}</td><td>${r0(s.f)}</td><td>${t.tr}</td><td style="color:${s.kcal>t.kcal*1.1?"#ff6b6b":"var(--ac)"}">${s.kcal>=t.kcal?"+":""}${r0(s.kcal-t.kcal)}</td></tr>`:`<tr><td>${d}</td><td colspan="6" style="color:var(--mu)">sem registro</td></tr>`}
  o+=`<div class="card"><h2>Planilha dos últimos 7 dias</h2><div class="tw"><table><thead><tr><th>Dia</th><th>kcal</th><th>P</th><th>C</th><th>G</th><th>Treino</th><th>Saldo</th></tr></thead><tbody>${w}</tbody></table></div><div class="sub" style="margin-top:10px">Saldo = calorias ingeridas − meta do dia. Valores estimados; não substituem a orientação de um nutricionista.</div></div>`;
  $("dBot").innerHTML=o;
}

// ===== Eventos =====
function tab(n){for(let i=1;i<=4;i++){$("pg"+i).classList.toggle("hide",i!==n);$("t"+i).classList.toggle("sel",i===n)}window.scrollTo(0,0)}
[1,2,3,4].forEach(i=>$("t"+i).onclick=()=>tab(i));
$("gchips").onclick=e=>{const b=e.target.closest(".chip");if(b){gsel=b.dataset.k;renderGuia()}};
$("dBot").onclick=e=>{const b=e.target.closest(".del");if(b){st.food=st.food.filter(x=>x.id!=b.dataset.fid);save();renderDieta()}};
["fsel","fg","fnome","fk","fp","fc","ff"].forEach(i=>$(i).oninput=fprev);
$("fadd").onclick=()=>{const c=fcalc();if(!(c.g>0||c.kcal>0)){toast("Informe a quantidade");return}
  st.food.push({id:Date.now(),data:key(new Date()),ref:$("fref").value,nome:c.nome,g:r0(c.g),kcal:r0(c.kcal),p:Math.round(c.p*10)/10,c:Math.round(c.c*10)/10,f:Math.round(c.f*10)/10});
  save();renderDieta();toast("✓ Alimento adicionado");};
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(b){sel=b.dataset.k;sub=Object.keys(ATIV[sel].subs)[0];buildForm()}};
$("sub").onclick=e=>{const b=e.target.closest("button");if(b){sub=b.dataset.s;buildForm()}};
$("seg").onclick=e=>{const b=e.target.closest("button");if(b){inten=b.dataset.i;buildForm()}};
$("pchips").onclick=e=>{const b=e.target.closest(".chip");if(b){psel=b.dataset.k;renderPerf()}};
$("dur").oninput=live;
$("goal").onchange=()=>{st.meta=Math.max(5,+$("goal").value||20);save();render()};
$("peso").onchange=()=>{st.peso=Math.max(30,+$("peso").value||70);save();live()};
$("hist").onclick=e=>{const b=e.target.closest(".del");if(b){st.logs=st.logs.filter(l=>l.id!=b.dataset.id);save();render()}};

function confetti(){const cs=["#58e06b","#ff9f1c","#4cc9f0","#f72585","#ffd166"];
  for(let i=0;i<36;i++){const p=document.createElement("div");p.className="pc";p.style.background=cs[i%5];
    p.style.setProperty("--x",(Math.random()*300-150)+"px");p.style.setProperty("--y",(Math.random()*-260-40)+"px");p.style.setProperty("--r",(Math.random()*720)+"deg");
    document.body.appendChild(p);setTimeout(()=>p.remove(),1200)}}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2600)}

$("done").onclick=()=>{
  const l=read();
  if(sel==="musculacao"&&!(l.ex.series&&l.ex.reps)){toast("Informe séries e repetições");return}
  if(sel!=="musculacao"&&!l.dist){toast("Informe a distância");return}
  const tk=key(new Date()),before=minOn(tk)>=st.meta;
  l.id=Date.now();l.data=tk;l.kcal=kcalOf(l);st.logs.push(l);save();
  buildForm();render();
  const after=minOn(tk)>=st.meta;
  if(after&&!before){confetti();const s=$("streak");s.classList.remove("pop");void s.offsetWidth;s.classList.add("pop");const c=streaks().cur;toast("🔥 Sequência de "+c+(c===1?" dia!":" dias!"))}
  else toast("✓ Treino registrado!");
};
$("goal").value=st.meta;$("peso").value=st.peso;
$("fref").innerHTML=FREF.map(r=>`<option>${r}</option>`).join("");
$("fsel").innerHTML=FOODS.map((f,i)=>`<option value="${i}">${f[0]}</option>`).join("")+'<option value="x">Outro (digitar valores)</option>';
buildForm();render();fprev();
</script>
